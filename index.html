<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>글로벌현장학습 런던 지도</title>
<meta name="description" content="글로벌현장학습 런던 일정·지하철·숙소 지도">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 구조
   PC  : 왼쪽 패널(검색 · 요일 바로가기 · 탭) + 지도. 장소를 누르면 지도 위 말풍선.
   폰  : 지도 전체 화면 + 위쪽 검색창 + 오른쪽 위 [지도 설정] 버튼 하나.
         아래 패널은 손가락으로 끌어 올림. 장소를 누르면 정보가 아래 패널에 카드로 뜸 (구글지도 방식). */
:root{
  --bg:#f4f6f5; --panel:#ffffff; --fg:#17201d; --muted:#66716c; --line:#e1e6e3; --soft:#f1f4f2;
  --accent:#0f6e5c; --accent-soft:#e2f1ec; --lmk:#7b4fb5;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --shadow:0 2px 10px rgba(20,30,25,.16);
  --sheet:0px; --top:max(10px,env(safe-area-inset-top,0px));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--fg);background:var(--bg);font-size:14px;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:fixed;inset:0;display:flex}

/* ---------- 패널 ---------- */
#panel{width:380px;flex:none;height:100%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:1000;position:relative}
#grab{display:none}
#pcol{position:absolute;z-index:1001;left:380px;top:50%;transform:translateY(-50%);width:22px;height:60px;border:1px solid var(--line);border-left:none;background:#fff;border-radius:0 10px 10px 0;box-shadow:2px 0 6px rgba(0,0,0,.08);font-size:15px;color:var(--muted);padding:0;transition:left .2s ease}
@media (min-width:768px){#panel{transition:width .2s ease;overflow:hidden}#app.collapsed #panel>*{visibility:hidden}#app.collapsed #panel{width:0;border-right:none}#app.collapsed #pcol{left:0}}
.ph{padding:18px 18px 8px}
.ph h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.4px}
.ph p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
#searchbox{margin:6px 18px 8px;position:relative;z-index:5}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 40px 11px 38px;background:var(--soft)}
.search input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.search input:focus{background:#fff;border-color:var(--accent);outline:none}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#qclr{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:none;background:none;width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:19px}
#results{margin-top:6px;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:46vh;background:#fff}
.rhead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:12px;color:var(--muted);background:var(--soft);position:sticky;top:0}
.rhead button{border:none;background:none;color:var(--muted);font-size:12px;text-decoration:underline}
.res{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:none;border-top:1px solid var(--line);background:#fff;padding:11px 12px}
.res:hover{background:var(--soft)}
.res .n{flex:none;width:22px;height:22px;border-radius:50%;background:#17201d;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.res b{display:block;font-size:13.5px}.res span{font-size:11.5px;color:var(--muted)}
.rnote{padding:12px;font-size:12.5px;color:var(--muted);line-height:1.5}

/* 요일 바로가기 */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 18px 12px}
.dbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25;min-width:0}
.dbtn b{font-size:13px;display:flex;align-items:center;gap:4px}
.dbtn b i{width:8px;height:8px;border-radius:50%}
.dbtn span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dbtn:disabled{opacity:.55;cursor:default}
.tabs{display:flex;padding:0 12px;border-bottom:1px solid var(--line)}
.tab{flex:1;border:none;background:none;padding:10px 4px 11px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;font-size:13.5px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.body{flex:1;overflow-y:auto;padding:16px 18px 28px;padding-bottom:max(28px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}

/* 일정 타임라인 */
.tl{display:flex;flex-direction:column;position:relative}
.tl::before{content:"";position:absolute;left:16px;top:10px;bottom:10px;width:2px;background:var(--line)}
.row{display:flex;gap:12px;position:relative;padding:6px 0}
.dot{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;border:3px solid var(--panel)}
.dot.sm{background:#c9d1cd;font-size:12px}
.rowc{flex:1;min-width:0}
.rowc .date{font-size:12px;color:var(--muted)}
.rowc .t{font-size:14px;font-weight:700;margin-top:1px}
.rowc .s{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.card{border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:var(--panel);margin-top:6px}
.card h3{margin:0;font-size:15.5px}
.card p{margin:6px 0 0;font-size:13px;line-height:1.6}
.card .how{background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:12.8px;line-height:1.55}
.btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.del{color:#b3362d}
.tbd{border-style:dashed;background:var(--soft)}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.info{border-radius:12px;background:var(--accent-soft);padding:11px 13px;font-size:12.8px;line-height:1.6}
.sec{font-size:12px;font-weight:800;color:var(--muted);margin-top:4px}

/* 내 장소 */
.mypin{border:1px solid var(--line);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
.mypin .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mypin input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-weight:700}
.mypin select{border:1px solid var(--line);border-radius:8px;padding:7px;background:#fff}
.mypin .st{font-size:12px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}

/* 가이드 */
details{border:1px solid var(--line);border-radius:12px;background:#fff}
summary{list-style:none;padding:12px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--muted);font-weight:400}
details[open] summary::after{content:"－"}
details ul{margin:0;padding:0 14px 12px 32px}
details li{font-size:13px;line-height:1.65}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:#fdf0e1;color:#a65a10;vertical-align:1px}

/* 장소 카드 (폰에서 아래 패널에 뜨는 정보) */
#v-card{padding-top:10px}
.cardhead{display:flex;justify-content:flex-end;margin-bottom:-6px}
.cardhead button{border:none;background:var(--soft);border-radius:999px;width:34px;height:34px;font-size:17px;color:var(--muted)}

/* ---------- 지도 위 컨트롤 ---------- */
#mapwrap{flex:1;position:relative;height:100%}
#map{position:absolute;inset:0;background:#e9ece9}
.fab{position:absolute;z-index:900;top:var(--top);right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.fbtn{min-width:56px;min-height:50px;border:none;background:#fff;border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--fg);padding:6px 6px}
.fbtn svg{width:20px;height:20px}
.fbtn[aria-expanded="true"]{background:var(--accent);color:#fff}
#pop{position:absolute;z-index:950;top:var(--top);right:80px;width:290px;max-height:calc(100% - 24px);overflow:auto;background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:14px}
#pop h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700}
#pop .grp{margin-bottom:14px}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.base{border:2px solid var(--line);background:#fff;border-radius:11px;padding:9px;text-align:left;font-size:13px;font-weight:800;line-height:1.35}
.base span{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.base[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;font-size:14px;font-weight:700;border-top:1px solid var(--line)}
.sw:first-of-type{border-top:none}
.sw input{width:44px;height:24px;appearance:none;-webkit-appearance:none;background:#cfd6d2;border-radius:999px;position:relative;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{left:23px}
.slider .top{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.slider input{width:100%}
.slider .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
.legend button{border:none;background:none;padding:5px 3px;display:flex;align-items:center;gap:7px;font-size:12.5px;text-align:left;border-radius:6px}
.legend button.on{background:var(--accent-soft);font-weight:700}
.legend i{width:18px;height:5px;border-radius:3px;flex:none}
#hlbar{position:absolute;z-index:900;left:50%;transform:translateX(-50%);top:var(--top);background:#17201d;color:#fff;border:none;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}
#areabtn{position:absolute;z-index:905;left:50%;transform:translateX(-50%);top:calc(var(--top) + 48px);background:#fff;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(var(--sheet) + 24px);transform:translateX(-50%);background:#17201d;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:3000;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}

/* ---------- 지도 안 표시 ---------- */
.leaflet-div-icon{background:none;border:none}
.pinlab{position:absolute;left:34px;top:6px;background:#fff;color:#17201d;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;box-shadow:0 1px 4px rgba(0,0,0,.3);white-space:nowrap;font-family:var(--font)}
.lmk-lab{font-family:var(--font);font-size:11.5px;font-weight:700;color:#5b3d8a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;position:absolute;left:10px;top:-8px}
.st-tip{font-family:var(--font);font-size:11px;font-weight:700;padding:1px 5px;background:rgba(255,255,255,.9);border-radius:4px;color:#222;position:absolute;left:7px;top:-9px;white-space:nowrap}
.hide-lmk .lmk-lab{display:none}
.hide-lmkdot .lmkdot{display:none}
.hide-sm .pinlab.sm{display:none}
.zo .bigpin .pinlab,.zo .pinlab.sm{display:none}
.zo .bigpin svg{transform:scale(.72);transform-origin:50% 100%}
.zo2 .bigpin svg{transform:scale(.6)}
.leaflet-popup-content-wrapper{border-radius:14px}
.leaflet-popup-content{font-family:var(--font);font-size:13px;line-height:1.55;margin:13px 15px;min-width:220px}
.pp h4{margin:0;font-size:16px;line-height:1.35}
.pp .k{font-size:12px;font-weight:700;margin-top:2px}
.pp .d{margin-top:7px;font-size:13px;line-height:1.6}
.pp .near{margin-top:9px;padding-top:9px;border-top:1px solid #e1e6e3}
.pp .near b.h{font-size:12px;color:#66716c}
.stl{margin:4px 0 0;padding:0;list-style:none;font-size:13px}
.stl li{display:flex;gap:6px;align-items:baseline;margin:4px 0}
.stl .ln{display:inline-flex;gap:2px;flex:none}.stl .ln i{width:7px;height:7px;border-radius:50%;display:inline-block}
.stl .m{color:#66716c;font-size:12px;margin-left:auto;white-space:nowrap}
.pp .btns .btn{flex:1}
.leaflet-control-attribution{font-size:10px!important}

/* ---------- 폰 ---------- */
@media (max-width:767px){
  :root{--sheet:88px}
  #app{display:block}
  #mapwrap{position:fixed;inset:0}
  #panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:88px;border-right:none;border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.18);transition:height .22s ease}
  #panel.dragging{transition:none}
  #pcol{display:none}
  #grab{display:flex;justify-content:center;align-items:center;height:24px;border:none;background:none;width:100%;touch-action:none;flex:none}
  #grab span{width:42px;height:5px;border-radius:3px;background:#c9cfcb}
  .ph{display:none}
  /* 검색창은 화면 위쪽으로 */
  #searchbox{position:fixed;top:var(--top);left:10px;right:76px;margin:0;z-index:1100}
  .search input{font-size:16px;background:#fff;border-color:transparent;box-shadow:var(--shadow);padding:12px 40px 12px 38px}
  #results{max-height:55vh;box-shadow:var(--shadow);border:none}
  .days{padding:2px 12px 10px;touch-action:none}
  .tabs{padding:0 8px}
  .body{padding:14px 16px 28px}
  .mypin input,.mypin select{font-size:16px}
  .fab{top:var(--top);right:10px}
  .fab .desk{display:none}
  .fbtn{min-width:56px;min-height:46px}
  .fab2{position:fixed;z-index:900;right:10px;bottom:calc(var(--sheet) + 12px);display:flex;flex-direction:column;gap:8px;transition:bottom .22s ease}
  .fab2 .fbtn{min-width:46px;width:46px;min-height:46px;border-radius:50%;font-size:0;gap:0}
  body.sheet-full .fab2{display:none}
  #pop{position:fixed;z-index:1200;left:10px;right:10px;width:auto;top:calc(var(--top) + 56px);max-height:calc(100dvh - var(--sheet) - var(--top) - 70px)}
  #hlbar{top:calc(var(--top) + 58px)}
  #areabtn{position:fixed;top:calc(var(--top) + 58px)}
  body:has(#hlbar:not([hidden])) #areabtn{top:calc(var(--top) + 100px)}
  .leaflet-control-zoom,.leaflet-control-scale{display:none}
  .pinlab{font-size:10.5px}
  .leaflet-bottom{bottom:var(--sheet)}
}
@media (min-width:768px){ .fab2{display:contents} .fab2 .fbtn{margin:0} }
@media (prefers-reduced-motion:reduce){#panel,.fab2{transition:none}}
</style>
</head>
<body>
<div id="app">
  <aside id="panel" aria-label="정보 패널">
    <button id="grab" aria-label="패널 크기 바꾸기"><span></span></button>
    <header class="ph">
      <h1>글로벌현장학습</h1>
      <p>런던 · 1.25.(월)~1.28.(목) 공식 일정 지도</p>
    </header>
    <div id="searchbox">
      <form class="search" id="sform" autocomplete="off" role="search">
        <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="호텔·장소·주소 검색 (한국어도 OK)" aria-label="호텔이나 장소 검색">
        <button type="button" id="qclr" aria-label="검색어 지우기" hidden>×</button>
      </form>
      <div id="results" hidden></div>
    </div>
    <div class="days" id="days" aria-label="요일 바로가기"></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" id="t-plan" aria-selected="true">일정</button>
      <button class="tab" role="tab" id="t-pins" aria-selected="false">내 장소 <span id="pinCount"></span></button>
      <button class="tab" role="tab" id="t-guide" aria-selected="false">가이드</button>
    </nav>
    <div class="body" id="v-plan"></div>
    <div class="body" id="v-pins" hidden></div>
    <div class="body" id="v-guide" hidden></div>
    <div class="body" id="v-card" hidden></div>
  </aside>

  <button id="pcol" aria-label="왼쪽 패널 접기" title="패널 접기">‹</button>
  <main id="mapwrap">
    <div id="map" aria-label="지도"></div>
    <button id="hlbar" hidden></button>
    <button id="areabtn" hidden>↻ 이 지역에서 다시 검색</button>
    <div class="fab">
      <button class="fbtn" id="b-set" aria-expanded="false" aria-controls="pop" aria-label="지도 설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>지도 설정</button>
      <div class="fab2">
        <button class="fbtn" id="b-loc" aria-label="내 위치">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span class="desk">내 위치</span></button>
        <button class="fbtn" id="b-home" aria-label="전체 보기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="desk">전체 보기</span></button>
      </div>
    </div>
    <div id="pop" hidden>
      <div class="grp"><h4>지도 종류</h4>
        <div class="bases">
          <button class="base" data-base="vec" aria-pressed="true">기본 1<span>깔끔한 기본 지도</span></button>
          <button class="base" data-base="simple" aria-pressed="false">기본 2<span>회색, 노선이 잘 보임</span></button>
          <button class="base" data-base="road" aria-pressed="false">상세<span>건물·가게까지</span></button>
          <button class="base" data-base="sat" aria-pressed="false">위성<span>실제 사진</span></button>
        </div></div>
      <div class="grp"><h4>지도에 표시</h4>
        <label class="sw">지하철 노선·역<input type="checkbox" id="c-lines" checked></label>
        <label class="sw">관광지<input type="checkbox" id="c-lmk"></label></div>

const isPhone=()=>matchMedia('(max-width:767px)').matches;
const gmap=(a,o)=>`https://www.google.com/maps/dir/?api=1&destination=${a},${o}&travelmode=transit`;

/* ===== 지도 ===== */
const map=L.map('map',{zoomControl:false,wheelPxPerZoomLevel:90,minZoom:8,maxZoom:19,maxBounds:[[50.9,-2.2],[52.2,1.0]]});
L.control.zoom({position:'bottomright'}).addTo(map);
L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);
const TO={keepBuffer:3,updateWhenZooming:false};
const BASES={
 vec:null,
 simple:L.layerGroup([L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{...TO,maxZoom:19,maxNativeZoom:16,attribution:'Tiles © Esri'}),L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:16})]),
 road:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{...TO,maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}),
 sat:L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{...TO,maxZoom:19,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:18}),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:18,opacity:.6})])
};
map.attributionControl.addAttribution('노선 데이터: TfL (oobrien/vis)');
function setBase(mode){
 Object.values(BASES).forEach(l=>l&&map.removeLayer(l));
 try{
  if(mode==='vec'&&!BASES.vec)BASES.vec=L.maplibreGL({style:'https://tiles.openfreemap.org/styles/liberty',fadeDuration:0,pixelRatio:Math.min(devicePixelRatio||1,2),attribution:'<a href="https://openfreemap.org">OpenFreeMap</a> © OpenMapTiles © OpenStreetMap'});
  BASES[mode].addTo(map);
 }catch(e){if(mode!=='simple'){toast('기본 1 지도를 열 수 없어 기본 2로 바꿨어요');setBase('simple');}return;}
 document.querySelectorAll('.base').forEach(b=>b.setAttribute('aria-pressed',b.dataset.base===mode));}
document.querySelectorAll('.base').forEach(b=>b.onclick=()=>setBase(b.dataset.base));

function dist(a,b){const R=6371000,t=Math.PI/180;const x=(b[1]-a[1])*t*Math.cos((a[0]+b[0])/2*t),y=(b[0]-a[0])*t;return Math.sqrt(x*x+y*y)*R;}
/* ===== 지하철 노선 (겹치는 구간은 나란히) ===== */
map.createPane('lines');map.getPane('lines').style.zIndex=410;
map.createPane('stations');map.getPane('stations').style.zIndex=420;
const lineR=L.canvas({pane:'lines',padding:.3,tolerance:matchMedia('(max-width:767px)').matches?14:7}),stR=lineR; /* 한 캔버스에 같이 그려야 노선 터치가 됨 */
const lineLayer=L.layerGroup().addTo(map);const polys=[];let hl=null;const HL=new Set(); /* 선택한 노선들 (겹친 곳 누르면 여러 개) */
const isOn=l=>!HL.size||HL.has(l);
const groups={};D.segs.forEach(s=>{const k=JSON.stringify(s.c);(groups[k]=groups[k]||[]).push(s.l)});
const order=Object.keys(COL);
function lineW(){const z=map.getZoom();return isPhone()?(z>=17?4.5:z>=15?3.5:z>=13?2.6:z>=11?2:1.5):(z>=17?6.5:z>=15?5:z>=13?3.6:z>=11?2.8:2);}
/* 너무 촘촘한 점은 솎아냄 → 노선을 나란히 벌릴 때 작은 고리(점처럼 보이는 것)가 생기지 않게 */
function thin(c,minM){const out=[c[0]];for(let i=1;i<c.length-1;i++){if(dist(out[out.length-1],c[i])>=minM)out.push(c[i]);}const last=c[c.length-1];if(out.length>1&&dist(out[out.length-1],last)<minM*0.5)out.pop();out.push(last);return out;}
Object.entries(groups).forEach(([k,ls])=>{const c=thin(JSON.parse(k),45);if(c.length<2||(c[0][0]===c[1][0]&&c[0][1]===c[1][1]))return;ls=[...new Set(ls)].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
 ls.forEach((l,i)=>{const p=L.polyline(c,{pane:'lines',renderer:lineR,color:COL[l],weight:lineW(),offset:(i-(ls.length-1)/2)*lineW(),lineCap:'butt',lineJoin:'round'});p._ln=l;p._i=i;p._n=ls.length;
  p.on('click',e=>{L.DomEvent.stop(e);lineTap(e,l);});p.on('dblclick',e=>L.DomEvent.stop(e));p.addTo(lineLayer);polys.push(p);});});
/* 노선을 누르면: 그 지점에 겹친 노선을 모두 선택. 이미 선택된 노선을 다시 누르면 전체 보기로 */
function lineTap(e,l){if(HL.size&&HL.has(l)){setHL([]);return;}const pt=e.layerPoint;const hit=new Set();polys.forEach(q=>{if(q._parts&&q._parts.length&&q._containsPoint(pt))hit.add(q._ln);});hit.add(l);setHL([...hit]);}
let lastSty='';
function styleAll(force){const v=+$('#r-op').value,w=lineW(),key=v+'|'+w+'|'+hl;$('#opv').textContent=v+'%';if(!force&&key===lastSty)return;const wChanged=!lastSty||lastSty.split('|')[1]!=String(w);lastSty=key;
 polys.forEach(p=>{const on=isOn(p._ln);p.options.interactive=on;p.setStyle({opacity:HL.size?(on?1:0):v/100,weight:HL.size&&on?w+1.5:w});if(wChanged)p.setOffset((p._i-(p._n-1)/2)*w);});
 stMarks.forEach(m=>{const on=!HL.size||m._lines.some(x=>HL.has(x));m.options.interactive=on;m.setStyle({opacity:on?1:0,fillOpacity:on?1:0});});}
function applyOp(){styleAll();}
function restyle(){styleAll();}
function setHL(arr){HL.clear();arr.forEach(x=>HL.add(x));hl=HL.size?[...HL].sort().join(','):null;const b=$('#hlbar');b.hidden=!HL.size;
 if(HL.size)b.textContent=`${[...HL].map(x=>SHORT[x]||x).join(' · ')} 노선만 보는 중 · 모두 보기 ✕`;
 document.querySelectorAll('#legend button').forEach(x=>x.classList.toggle('on',HL.has(x.dataset.l)));restyle();drawStLabels();}
function highlight(l){setHL(l?[l]:[]);}
$('#hlbar').onclick=()=>highlight(null);
$('#r-op').oninput=applyOp;
$('#legend').innerHTML=Object.entries(COL).map(([k,c])=>`<button data-l="${esc(k)}"><i style="background:${c}"></i>${esc(SHORT[k]||k)}</button>`).join('');
$('#legend').onclick=e=>{const b=e.target.closest('button');if(!b)return;const l=b.dataset.l;const a=[...HL];setHL(HL.has(l)?a.filter(x=>x!==l):[...a,l]);};

/* 역 */
const stLayer=L.layerGroup().addTo(map);const STN={};const stMarks=[];
D.st.forEach(s=>{if(!STN[s.n])STN[s.n]={n:s.n,p:s.p,l:new Set()};s.l.forEach(x=>STN[s.n].l.add(x));});
const STATIONS=Object.values(STN).map(s=>({...s,l:[...s.l]}));
const lineTxt=l=>`<span style="color:${l==='Circle'?'#a88a00':COL[l]};font-weight:700">${esc(SHORT[l]||l)}</span>`;
STATIONS.forEach(s=>{const m=L.circleMarker(s.p,{pane:'lines',renderer:stR,radius:3.4,color:'#3a3f3c',weight:1.4,fillColor:'#fff',fillOpacity:1})
 .on('dblclick',e=>L.DomEvent.stop(e)).bindPopup(()=>card({title:s.n+' 역',kind:s.l.map(lineTxt).join(' · '),ll:s.p,near:false,save:s.n+' 역'})).addTo(stLayer);m._lines=s.l;stMarks.push(m);});
const stLab=L.layerGroup().addTo(map);
function drawStLabels(){stLab.clearLayers();if(map.getZoom()<15||!map.hasLayer(stLayer))return;const b=map.getBounds().pad(.1);
 STATIONS.forEach(s=>{if(b.contains(s.p)&&(!HL.size||s.l.some(x=>HL.has(x))))L.marker(s.p,{interactive:false,keyboard:false,icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="st-tip">${esc(s.n)}</div>`})}).addTo(stLab);});}
map.on('moveend',drawStLabels);

/* ===== 가까운 역 ===== */

function nearest(ll,n=3){return STATIONS.map(s=>({s,d:dist(ll,s.p)})).sort((a,b)=>a.d-b.d).slice(0,n);}
function walkMin(d){return Math.max(1,Math.round(d*1.3/80));}
function nearHTML(ll,n=3){const r=nearest(ll,n);
 return '<ul class="stl">'+r.map(({s,d})=>`<li><span class="ln">${s.l.map(l=>`<i style="background:${COL[l]}"></i>`).join('')}</span><b>${esc(s.n)}</b><span class="m">${d<1000?Math.round(d/10)*10+'m':(d/1000).toFixed(1)+'km'} · 도보 ${walkMin(d)}분</span></li>`).join('')+'</ul>';}

/* 장소 정보 카드 (PC = 말풍선, 폰 = 아래 패널) */
function card({title,kind,kindColor,body,ll,near=true,save,saveCat,extra=''}){
 const showNear=near&&ll&&nearest(ll,1)[0].d<=5000;
 return `<div class="pp"><h4>${esc(title)}</h4>${kind?`<div class="k" style="color:${kindColor||'#66716c'}">${kind}</div>`:''}${body?`<div class="d">${body}</div>`:''}
 ${showNear?`<div class="near"><b class="h">가까운 지하철역 (직선거리 기준)</b>${nearHTML(ll)}</div>`:''}
 <div class="btns">${ll?`<a class="btn pri" href="${gmap(ll[0],ll[1])}" target="_blank" rel="noopener">길찾기</a>`:''}${save&&ll?`<button class="btn" data-pin="${pj(save,ll[0],ll[1],saveCat||null)}">☆ 내 장소에 저장</button>`:''}${extra}</div></div>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pin],[data-del],[data-tab]');if(!b||!b.closest('.leaflet-popup,#v-card'))return;
 if(b.dataset.pin){const [n,a,o,c]=JSON.parse(b.dataset.pin);addPin(n,a,o,c);}else if(b.dataset.del)delPin(b.dataset.del);else{closeCard();showTab(b.dataset.tab);if(isPhone())setSheet('half');}});

/* 핀 아이콘 */
function pinIcon(color,txt,label,small,cls){const w=small?28:36,h=small?37:47;
 return L.divIcon({className:cls||'',iconSize:[w,h],iconAnchor:[w/2,h-1],popupAnchor:[0,-h+6],
  html:`<svg width="${w}" height="${h}" viewBox="0 0 40 52"><path d="M20 51C20 51 38 30 38 19A18 18 0 0 0 2 19C2 30 20 51 20 51Z" fill="${color}" stroke="#fff" stroke-width="2.5"/><text x="20" y="25.5" font-size="${txt.length>1?12:15}" font-weight="800" fill="#fff" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif">${esc(txt)}</text></svg>`+(label?`<div class="pinlab${small?' sm':''}" style="left:${w-2}px;border-left:4px solid ${color}">${esc(label)}</div>`:'')});}

/* ===== 일정 핀 ===== */
const planMarkers={};
PLAN.filter(p=>p.ll).forEach(p=>{planMarkers[p.id]=L.marker(p.ll,{icon:pinIcon(p.color,p.d,p.title,false,'bigpin'),zIndexOffset:1000}).addTo(map)
 .bindPopup(card({title:p.title,kind:p.date+' 공식 일정',kindColor:p.color,body:p.how,ll:p.ll}),{maxWidth:320});});
PLACES.forEach(p=>{L.marker(p.ll,{icon:pinIcon(p.color,p.d,p.name,true),zIndexOffset:800}).addTo(map)
 .bindPopup(card({title:p.name,body:p.note,ll:p.ll,near:false}),{maxWidth:300});});
L.polyline([[51.51710,-0.17732],[51.75345,-1.26995]],{color:'#0f8a74',weight:3,dashArray:'2 8',opacity:.8}).bindTooltip('목: Paddington → 옥스퍼드 기차 약 1시간 (방향만 표시)',{sticky:true}).addTo(map);

/* ===== 관광지 (한 가지 표시로 단순하게) ===== */
const lmkLayer=L.layerGroup();
LMK.forEach(([n,a,o,t,c])=>{
 L.marker([a,o],{icon:L.divIcon({className:'lmkdot',iconSize:[14,14],iconAnchor:[7,7],html:`<div style="width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--lmk)"></div><div class="lmk-lab">${esc(n)}</div>`})})
 .bindPopup(card({title:n,kind:'관광지 · '+LCAT[c].n,kindColor:'#7b4fb5',body:esc(t),ll:[a,o],save:n}),{maxWidth:310}).addTo(lmkLayer);});
$('#c-lmk').onchange=e=>{e.target.checked?lmkLayer.addTo(map):map.removeLayer(lmkLayer);};
$('#c-lines').onchange=e=>{if(e.target.checked){lineLayer.addTo(map);stLayer.addTo(map);}else{map.removeLayer(lineLayer);map.removeLayer(stLayer);if(hl)highlight(null);}drawStLabels();};

function zoomClass(){const z=map.getZoom(),c=map.getContainer().classList;c.toggle('hide-lmk',z<15);c.toggle('hide-sm',z<13);c.toggle('hide-lmkdot',z<13);c.toggle('zo',z<14);c.toggle('zo2',z<12);
 const r=z<12?2:z<14?3:4.5;if(r!==zoomClass.r){zoomClass.r=r;stMarks.forEach(m=>m.setRadius(r));}if(z<11)map.removeLayer(stLayer);else if($('#c-lines').checked&&!map.hasLayer(stLayer))stLayer.addTo(map);restyle();}
map.on('zoomend',zoomClass);

/* ===== 내 장소 (이 기기에 저장 + 링크로 공유) ===== */
let PINS=[];const pinLayer=L.layerGroup().addTo(map);const pinMk={};
function load(){try{PINS=JSON.parse(localStorage.getItem('cip-pins')||'[]');}catch(e){PINS=[];}}
function save(){try{localStorage.setItem('cip-pins',JSON.stringify(PINS));}catch(e){}}
function drawPins(){pinLayer.clearLayers();
 TEAM_PINS.forEach(p=>{L.marker([p.lat,p.lng],{icon:pinIcon(CAT[p.cat]?.c||'#3d6fd1','★',p.name),zIndexOffset:900})
  .bindPopup(card({title:p.name,kind:'공용 · '+(CAT[p.cat]?.n||''),body:p.note?esc(p.note):'',ll:[p.lat,p.lng]}),{maxWidth:320}).addTo(pinLayer);});
 PINS.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:pinIcon(CAT[p.cat].c,CAT[p.cat].n[0],p.name),draggable:!isPhone(),zIndexOffset:700});
  m.bindPopup(()=>card({title:p.name,kind:'내 장소 · '+CAT[p.cat].n,kindColor:CAT[p.cat].c,ll:[p.lat,p.lng],extra:`<button class="btn" data-tab="pins">이름 바꾸기</button><button class="btn del" data-del="${p.id}">삭제</button>`}),{maxWidth:320});
  m.on('dragend',()=>{const ll=m.getLatLng();p.lat=+ll.lat.toFixed(6);p.lng=+ll.lng.toFixed(6);save();renderPins();});
  m.addTo(pinLayer);pinMk[p.id]=m;});
 $('#pinCount').textContent=PINS.length?`(${PINS.length})`:'';}
function addPin(name,lat,lng,cat){if(PINS.some(p=>p.name===name&&Math.abs(p.lat-lat)<1e-5&&Math.abs(p.lng-lng)<1e-5)){toast('이미 저장된 장소예요');return;}
 const p={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:String(name).slice(0,60),lat:+(+lat).toFixed(6),lng:+(+lng).toFixed(6),cat:cat||guessCat(name)};
 PINS.push(p);save();drawPins();renderPins();toast('내 장소에 저장했어요');}
function delPin(id){PINS=PINS.filter(p=>p.id!==id);save();drawPins();renderPins();map.closePopup();closeCard();toast('삭제했어요');}
function guessCat(n){n=String(n).toLowerCase();if(/hotel|inn|hostel|호텔|숙소|lodge|suites|apartment|travelodge|ibis|novotel|hilton|holiday|premier/.test(n))return 'stay';if(/restaurant|cafe|coffee|식당|카페|bar|pub|kitchen|grill/.test(n))return 'food';return 'etc';}
function shareURL(){const data=PINS.map(p=>[p.name,p.lat,p.lng,p.cat]);
 const b=btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 return location.href.split('#')[0]+'#p='+b;}
function renderPins(){const v=$('#v-pins');
 let h=`<div class="info"><b>장소 저장하는 법</b><br>① 검색창에 호텔·장소 이름 → ② 결과를 눌러 <b>☆ 내 장소에 저장</b><br>지도를 <b>길게 누르면</b>(PC는 오른쪽 클릭) 그 자리도 저장할 수 있어요. 저장한 곳마다 가까운 역과 도보 시간이 나와요.</div>`;
 if(!PINS.length)h+=`<div class="empty">아직 저장한 장소가 없어요.<br>호텔 후보부터 검색해서 저장해 보세요.</div>`;
 else{h+=`<div class="sec">저장한 장소 ${PINS.length}개 · 이 기기에만 저장돼요</div>`;
  PINS.forEach(p=>{const n=nearest([p.lat,p.lng],1)[0];h+=`<div class="mypin" data-id="${p.id}"><div class="r"><input value="${esc(p.name)}" aria-label="장소 이름" data-f="name"><select data-f="cat" aria-label="분류">${Object.entries(CAT).map(([k,c])=>`<option value="${k}"${k===p.cat?' selected':''}>${c.n}</option>`).join('')}</select></div><div class="st">가장 가까운 역 <b>${esc(n.s.n)}</b> · 도보 약 ${walkMin(n.d)}분</div><div class="r"><button class="btn" data-a="go">지도에서 보기</button><a class="btn" href="${gmap(p.lat,p.lng)}" target="_blank" rel="noopener">길찾기</a><button class="btn del" data-a="del">삭제</button></div></div>`;});
  h+=`<div class="info"><b>조원에게 보내기</b><br>링크에 저장한 장소가 담겨요. 받은 사람이 열면 지도에 표시돼요.<div class="btns"><button class="btn pri" id="b-share">공유 링크 복사</button></div><input id="shareOut" readonly style="margin-top:8px;width:100%;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:12px" hidden></div>`;}
 v.innerHTML=h;
 const sb=$('#b-share');if(sb)sb.onclick=()=>{const u=shareURL();const o=$('#shareOut');o.hidden=false;o.value=u;
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('링크를 복사했어요 · 카톡에 붙여넣으세요')).catch(()=>{o.select();toast('링크를 길게 눌러 복사해 주세요');});};}
$('#v-pins').addEventListener('change',e=>{const c=e.target.closest('.mypin');if(!c)return;const p=PINS.find(x=>x.id===c.dataset.id);if(!p)return;
 p[e.target.dataset.f]=e.target.value.slice(0,60)||p.name;save();drawPins();if(e.target.dataset.f==='cat')renderPins();});
$('#v-pins').addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const id=b.closest('.mypin').dataset.id;
 if(b.dataset.a==='del')delPin(id);else{const p=PINS.find(x=>x.id===id);focusOn([p.lat,p.lng],17,()=>pinMk[id]?.openPopup());}});

/* 공유 링크로 들어온 경우 */
function importFromHash(){const m=location.hash.match(/^#p=([A-Za-z0-9_-]+)/);if(!m)return false;
 try{const s=m[1].replace(/-/g,'+').replace(/_/g,'/');const arr=JSON.parse(decodeURIComponent(escape(atob(s+'==='.slice((s.length+3)%4)))));
  const lay=L.layerGroup().addTo(map);const pts=[];
  arr.slice(0,50).forEach(([n,lat,lng,cat])=>{if(typeof lat!=='number'||typeof lng!=='number')return;cat=CAT[cat]?cat:'etc';n=String(n).slice(0,60);pts.push([lat,lng]);
   L.marker([lat,lng],{icon:pinIcon('#55605b','공',n)}).bindPopup(card({title:n,kind:'공유받은 장소',ll:[lat,lng],save:n,saveCat:cat}),{maxWidth:320}).addTo(lay);});
  if(pts.length){fitPts(pts,15);toast(`공유받은 장소 ${pts.length}개를 표시했어요`);return true;}
 }catch(e){toast('공유 링크를 읽지 못했어요');}return false;}

/* 길게 누르기 / 오른쪽 클릭 → 이 위치 */
map.on('contextmenu',e=>{const ll=[e.latlng.lat,e.latlng.lng];L.popup({maxWidth:320}).setLatLng(e.latlng).setContent(card({title:'이 위치',ll,save:'내가 찍은 곳',saveCat:'etc'})).openOn(map);});

/* 내 위치 · 전체 보기 */
let me=null;

KO_EN.sort((a,b)=>b[0].length-a[0].length);
const KO_WORD={'더':'The','바이':'by','인':'Inn','역':'station','앤':'and'};
const hasKo=s=>/[가-힣]/.test(s);
function toEnglish(q){let s=' '+q.replace(/[，、]/g,',')+' ';
 for(const [k,v] of KO_EN)s=s.split(k).join(' '+v+' ');
 s=s.split(/(\s+|,)/).map(w=>KO_WORD[w]!==undefined?KO_WORD[w]:w).join('');
 return s.replace(/[가-힣]+/g,' ').replace(/\s+,/g,',').replace(/\s+/g,' ').replace(/^[\s,]+|[\s,]+$/g,'').trim();}
const PC_RE=/\b([A-Z]{1,2}\d[A-Z\d]?)\s*(\d[A-Z]{2})\b/i;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let nomiNext=0;
const DEF_BOX=[-1.4,51.3,0.35,51.85]; /* 서,남,동,북 */
async function nominatim(q,box=DEF_BOX){const w=nomiNext-Date.now();if(w>0)await sleep(w);nomiNext=Date.now()+1100;
 const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=gb&bounded=1&accept-language=en&viewbox='+[box[0],box[3],box[2],box[1]].join(',')+'&q='+encodeURIComponent(q);
 const js=await (await fetch(u,{headers:{'Accept':'application/json'}})).json();
 return js.map(x=>({name:x.name||x.display_name.split(',')[0],addr:x.display_name.split(',').slice(1,4).join(',').trim(),lat:+x.lat,lng:+x.lon}));}
async function photon(q,box=DEF_BOX){const u='https://photon.komoot.io/api/?limit=8&lang=en&lat='+((box[1]+box[3])/2)+'&lon='+((box[0]+box[2])/2)+'&bbox='+box.join(',')+'&q='+encodeURIComponent(q);
 const js=await (await fetch(u)).json();
 return (js.features||[]).map(f=>{const p=f.properties;const street=[p.housenumber,p.street].filter(Boolean).join(' ');
  return {name:p.name||street||p.postcode||q,addr:[p.name?street:'',p.postcode,p.city||p.district].filter(Boolean).join(', '),lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]};});}
async function postcode(pc){const r=await (await fetch('https://api.postcodes.io/postcodes/'+encodeURIComponent(pc))).json();
 return r&&r.result?[{name:'우편번호 '+r.result.postcode,addr:[r.result.admin_district,'London'].filter(Boolean).join(', '),lat:r.result.latitude,lng:r.result.longitude}]:[];}
const safe=p=>p.catch(()=>[]);
async function smartSearch(q,box){const B=box||DEF_BOX;const inBox=x=>x.lng>=B[0]&&x.lng<=B[2]&&x.lat>=B[1]&&x.lat<=B[3];
 const en=toEnglish(q)||q;const pcm=en.match(PC_RE)||q.match(PC_RE);const pc=pcm?(pcm[1]+' '+pcm[2]).toUpperCase():null;
 const v1=en.replace(/,?\s*United Kingdom\b/i,'').trim();
 const v2=v1.replace(/\s+by\s+.+$/i,'').trim();
 const street=pc?v1.split(',')[0].trim():'';
 const pPh=Promise.all([safe(photon(v1,B)),v2!==v1?safe(photon(v2,B)):[] ,pc&&!box?safe(postcode(pc)):[]]);
 let nomi=[];for(const v of [...new Set([v1,v2,pc&&street&&street!==pc?street+', '+pc:null].filter(Boolean))]){nomi=await safe(nominatim(v,B));if(nomi.length)break;}
 const [ph1,ph2,pcr]=await pPh;
 /* 지도 데이터에 브랜드명이 빠진 호텔 보완 (예: The Tower Hotel, by Thistle) */
 const extra=[];for(const [brand,items] of Object.entries(BRAND_EXTRA))if(new RegExp('\\b'+brand+'\\b','i').test(en))items.forEach(it=>extra.push({...it}));
 const order=pc?[...extra,...ph1,...nomi,...ph2,...pcr]:[...extra,...nomi,...ph1,...ph2,...pcr];
 const norm=s=>s.toLowerCase().replace(/[^a-z0-9가-힣]/g,'');
 const out=[];for(const x of order){if(!isFinite(x.lat)||!isFinite(x.lng)||(box&&!inBox(x)))continue;
  if(out.some(y=>(norm(y.name)===norm(x.name)&&dist([y.lat,y.lng],[x.lat,x.lng])<500)||(dist([y.lat,y.lng],[x.lat,x.lng])<80&&(norm(y.name).includes(norm(x.name))||norm(x.name).includes(norm(y.name))))||(x.name.startsWith('우편번호')&&dist([y.lat,y.lng],[x.lat,x.lng])<60)))continue;out.push(x);}
 return {en,list:out.slice(0,box?8:6)};}
const BRAND_EXTRA={Thistle:[{name:'The Tower Hotel (by Thistle)',addr:"St Katharine's Way, E1W 1LD, London",lat:51.50662,lng:-0.07328}]};

  r.innerHTML=`<div class="rhead">${area?'이 지역 ':''}검색 결과 ${list.length}개 · 눌러서 위치 보기<button type="button" id="clr">닫기</button></div>`+tr+list.map((x,i)=>`<button class="res" data-i="${i}"><span class="n">${i+1}</span><div><b>${esc(x.name)}</b><span>${esc(x.addr)}</span></div></button>`).join('');
  const pts=[];

   x._m=L.marker(ll,{icon:pinIcon('#17201d',String(i+1),null,true),zIndexOffset:1200}).bindPopup(card({title:x.name,kind:esc(x.addr),ll,save:x.name}),{maxWidth:320}).addTo(searchLayer);});

  searchCenter=map.getCenter();searchZoom=map.getZoom();
  r.querySelectorAll('.res').forEach(b=>b.onclick=()=>{const x=list[+b.dataset.i];if(isPhone())r.hidden=true;focusOn([x.lat,x.lng],17,()=>x._m.openPopup());});
  $('#clr').onclick=()=>{r.hidden=true;};
 }catch(err){r.innerHTML='<div class="rnote">검색 서버에 연결하지 못했어요. 잠시 후 다시 해 주세요.</div>';}}

const panel=$('#panel');let sheet='peek';let curTab='plan';
const SNAP={peek:()=>($('#grab').offsetHeight||24)+($('#days').offsetHeight||60)+4,card:()=>Math.min(Math.round(innerHeight*.66),SNAP.peek()+$('#v-card').scrollHeight+12),half:()=>Math.round(innerHeight*.5),full:()=>Math.round(innerHeight*.9)};
function sheetH(){return isPhone()?SNAP[sheet]():0;}
function setSheet(s){if(!isPhone())return;sheet=s;const h=SNAP[s]();panel.style.height=h+'px';document.documentElement.style.setProperty('--sheet',h+'px');document.body.classList.toggle('sheet-full',s==='full');}
(function drag(){let y0=0,h0=0,dy=0,on=false;const ORDER=['peek','half','full'];
 const start=e=>{if(!isPhone()||e.target.closest('input,button:not(#grab),select,a'))return;on=true;dy=0;y0=e.clientY;h0=panel.offsetHeight;panel.classList.add('dragging');};
 const move=e=>{if(!on)return;dy=e.clientY-y0;panel.style.height=Math.min(innerHeight*.92,Math.max(90,h0-dy))+'px';};
 const end=()=>{if(!on)return;on=false;panel.classList.remove('dragging');const cur=sheet==='card'?1:ORDER.indexOf(sheet);
  if(Math.abs(dy)<6){if(sheet==='card'){setSheet('full');return;}setSheet(ORDER[(cur+1)%3]);return;}
  if(dy<-50){setSheet(dy<-300?'full':ORDER[Math.min(2,cur+1)]);return;}
  if(dy>50){if(sheet==='card'){closeCard();return;}setSheet(dy>300?'peek':ORDER[Math.max(0,cur-1)]);return;}
  setSheet(sheet);};
 ['#grab','#days'].forEach(s=>$(s).addEventListener('pointerdown',start));
 addEventListener('pointermove',move);addEventListener('pointerup',end);addEventListener('pointercancel',end);})();

<details open><summary>이 지도 쓰는 법</summary><ul>
 <li><b>요일 버튼</b>(월·수·목)을 누르면 그날 가는 곳으로 바로 이동해요.</li>
 <li>핀·관광지·역을 누르면 <b>가까운 역</b>과 <b>길찾기</b>(구글 지도 대중교통 경로)가 나와요.</li>
 <li><b>지도 설정</b> 버튼: 지도 종류(기본 1·기본 2·상세·위성), 노선·관광지 켜기/끄기, 노선 선명도.</li>
 <li>폰에서는 아래 패널을 위로 끌면 일정·내 장소·가이드가 보여요.</li></ul></details>
<details><summary>교통카드: 따로 안 사도 돼요</summary><ul>
 <li>해외결제 되는 <b>컨택리스(터치) 카드</b>나 휴대폰 페이를 개찰구에 찍으면 끝이에요. 실물 교통카드 <b>Oyster</b>를 사도 돼요.</li>
 <li><b>한 사람 = 카드 한 장.</b> 한 카드로 두 명 결제는 안 돼요.</li>

 <li>같은 카드를 계속 쓰면 하루 요금 <b>상한(cap)</b>이 자동 적용돼서, 많이 타도 일정 금액 이상 안 나가요.</li></ul></details>
<details><summary>지하철(Tube) 타는 법</summary><ul>
 <li>런던 지하철은 <b>노선 이름 + 방향</b>으로 찾아요. 예: "Central line, Eastbound".</li>
 <li>지도 위 노선을 누르면 그 노선만 보여요. 여러 노선이 겹친 곳을 누르면 겹친 노선이 함께 보여요. 한 번 더 누르면 전체로 돌아가요.</li>

 <li>이 지도의 노선은 역과 역을 잇는 <b>개략선</b>이라 실제 선로 위치와 조금 다를 수 있어요.</li></ul></details>
